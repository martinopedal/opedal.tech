name: Fact-check content

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'content/**'
      - 'cv/data/**'
      - 'scripts/check-facts.mjs'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'content/**'
      - 'cv/data/**'
      - 'scripts/check-facts.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide-runner:
    uses: martinopedal/github-runners-alz-corp-cookbook/.github/workflows/decide-runner.yml@v1
    with:
      self-hosted-labels: '["self-hosted", "public-linux"]'

  check:
    name: Fact-check content
    needs: decide-runner
    runs-on: ${{ fromJSON(needs.decide-runner.outputs.runner-labels) }}
    timeout-minutes: 5

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run fact-checker
        run: node scripts/check-facts.mjs

