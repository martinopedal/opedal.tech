        url: https://github.com/martinopedal/aks-automatic-ingress-migration
        summary: "Automated migration from NGINX Ingress to Application Gateway for Containers on AKS Automatic clusters"

  - group: Other Tooling
    repos:
      - name: linkedin-auto-poster
        lang: Python
        url: https://github.com/martinopedal/linkedin-auto-poster
