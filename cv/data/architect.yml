    - Enterprise Architecture
    - C-Suite Advisory
    - AI Platforms
    - Security & Compliance
    - Migration & Modernization
    - Technology Strategy
    - Cloud Consolidation
    - Kubernetes / AKS
    - Stakeholder Management

  # Technical skills grouped by category, mirroring LinkedIn taxonomy for ATS alignment.
  # Source of truth: the maintainer's LinkedIn profile as of 2026-05.
  # Do NOT add numeric ratings. Flat lists match ATS keyword patterns and avoid
  # the self-rating trap where 15 years Azure experience reads as "40%".
  industry_knowledge:
    - Microsoft Azure
    - Cloud Architecture
    - Solution Architecture
    - Enterprise Architecture
    - Cloud Governance
    - Cloud Security
    - Network Security
    - Cybersecurity
    - Technical Leadership
    - Platform Engineering
    - Cloud-Native Architecture
    - Azure Landing Zones
    - Well-Architected Framework
    - Cloud Adoption Framework
    - Stakeholder Management
    - Technical Presentations
    - Project Delivery
    - Migration Projects

  tools_technologies:
    - Azure Kubernetes Service (AKS)
    - Kubernetes
    - Terraform
    - Bicep (Domain-Specific Language)
    - Infrastructure as code (IaC)
    - Generative AI
    - Artificial Intelligence (AI)
    - Machine Learning
    - GitHub Copilot
    - GitHub
    - GitOps
    - Azure DevOps Services
    - Continuous Integration and Continuous Delivery (CI/CD)
    - DevOps
    - Microservices
    - Docker
    - Identity and Access Management (IAM)
    - Microsoft Entra ID
    - Microsoft Defender for Cloud
    - Azure Policy
    - PowerShell
    - Virtualization
    - Network Administration

  # Free-text tag cloud. Rendered as pill spans on /cv.
  # Aligned with ATS keywords for Cloud Solution Architect / Lead roles and LinkedIn
  # recommendation themes. Generic soft skills ("Interpersonal Skills") removed.
  competencies:
    - Trusted Advisor
    - Executive Engagement
    - Enterprise Architecture
    - Azure Landing Zones (ALZ)
    - Cloud Adoption Framework
    - Well-Architected Framework
    - Solution Design
    - Technical Pre-Sales
    - Pre-Sales Engineering
    - Customer Success
    - Strategic + Operational Range
    - Architectural Strategy
    - Stakeholder Management
    - Technical Leadership
    - Cross-Functional Collaboration
    - Reference Architectures
    - Workshop Facilitation
    - Technical Evangelism
    - End-to-End Project Delivery
    - Open Knowledge Sharing
    - Holistic Solution Design
    - Mentorship

# `kind` is a typed bucket rendered on /cv as a small superscript label.
#
# Certifications listed below are ACTIVE as of the latest renewal cycle.
# Source of truth: the maintainer's Microsoft Learn dashboard + HashiCorp + AXELOS.
# Order: Microsoft Expert (by latest renewal) → Microsoft Associate (by latest renewal)
# → vendor certs (Terraform, ITIL).
certifications:
  - { name: "Microsoft Certified: Cybersecurity Architect Expert",        kind: cloud, current_as_of: 2026 }
  - { name: "Microsoft Certified: Azure Solutions Architect Expert",      kind: cloud, current_as_of: 2025 }
  - { name: "Microsoft Certified: DevOps Engineer Expert",                kind: cloud, current_as_of: 2025 }
  - { name: "Microsoft 365 Certified: Administrator Expert",              kind: cloud, current_as_of: 2025 }
  - { name: "Microsoft Certified: Azure Network Engineer Associate",      kind: cloud, current_as_of: 2026 }
  - { name: "Microsoft Certified: Azure Administrator Associate",         kind: cloud, current_as_of: 2025 }
  - { name: "Microsoft Certified: Azure Security Engineer Associate",     kind: cloud, current_as_of: 2025 }
  - { name: "HashiCorp Certified: Terraform Associate",                   kind: tooling }
  - { name: "ITIL Foundation",                                            kind: tooling }

# Speaking credibility for the /speaking section on /cv and the homepage line.
# Verifiable, factual, no embellishment.
speaking:
  - venue: Nordic Infrastructure Conference (NIC) 2026
    talk: "No More Spec-ulation: AI Agent Teams Building Production-Grade IaC"
    metric: October 2026
  - venue: "Agentic AI & DevOps Days"
    talk: "Where does code generation stop and InfraOps start?"
    metric: June 2026
  - venue: Nordic Infrastructure Conference (NIC)
    talk: Live-streamed Level 300 session
    metric: 94% approval
  - venue: Microsoft customer sessions
    talk: "GHAS, GitHub / Azure DevOps, Azure Arc / Local"
    metric: Enterprise and regulated industries
  - venue: Microsoft internal events
    talk: Architecture and platform sessions
    metric: 50 to 100 in-person, 200+ virtual

# Reserved for future expansion. Empty arrays are valid; cv.astro skips
# the section header when empty.
education: []

# Open Source contributions, repos grouped by theme.
open_source:
  - group: Azure Governance & Assessment
    repos:
      - name: azure-analyzer
        lang: PowerShell
        url: https://github.com/martinopedal/azure-analyzer
        summary: "Bundled assessment runner that unifies azqr, PSRule, AzGovViz, and 135 ALZ graph queries into one portable JSON + HTML report"
      - name: alz-graph-queries
        lang: PowerShell
        url: https://github.com/martinopedal/alz-graph-queries
        summary: "Automated ALZ checklist validation: 135 Azure Resource Graph queries that take coverage from 49 to 135 items"

  - group: GitHub Runners & Private Networking
    repos:
      - name: avm-ptn-cicd-agents-and-runners
        lang: Terraform
        url: https://github.com/martinopedal/terraform-azurerm-avm-ptn-cicd-agents-and-runners
        summary: "Official AVM pattern module for self-hosted ADO agents and GitHub runners with PAT and UAMI auth, no public IP egress"
      - name: ghec-vnet-runners-azure
        lang: Terraform
        url: https://github.com/martinopedal/ghec-vnet-runners-azure
        summary: "GitHub-hosted runners with Azure VNet integration for GHE.com, EU data residency and private endpoint connectivity"
      - name: terraform-azurerm-github-runners-alz-corp
        lang: Terraform
        url: https://github.com/martinopedal/terraform-azurerm-github-runners-alz-corp
        summary: "Self-hosted GitHub Actions runners that run inside ALZ Corp landing zones with central firewall egress"

  - group: Terraform Platform Modules
    repos:
      - name: terraform-azapi-aks-automatic
        lang: Terraform
        url: https://github.com/martinopedal/terraform-azapi-aks-automatic
        summary: "AKS Automatic with ALZ Corp networking, BYO VNet, multiple ingress options (AGC/NGINX/Istio), managed identity everywhere"
      - name: avm-ptn-aiml-ai-foundry
        lang: Terraform
        url: https://github.com/martinopedal/terraform-azurerm-avm-ptn-aiml-ai-foundry
        summary: "Official AVM pattern module for Azure AI Foundry (formerly AI Studio) with network isolation and private endpoints"

  - group: AKS Automation
    repos:
      - name: aks-automatic-ingress-migration
